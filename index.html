<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nicolás Rivera | GitHub</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="wrap">
    <section class="panel">
      <h1 class="name">Nicolás Rivera</h1>
      <p class="tag">Select a GitHub profile</p>

      <div class="row">
        <a
          class="btn neutral"
          href="https://github.com/nicolasrivera25"
          target="_blank"
          rel="noopener noreferrer"
          data-hint="University projects & academic repositories"
        >
          Institutional
          <span class="arrow" aria-hidden="true">↗</span>
          <span class="hint" aria-hidden="true"></span>
        </a>

        <a
          class="btn orange"
          href="https://github.com/nicolasrivera2003"
          target="_blank"
          rel="noopener noreferrer"
          data-hint="(NEW ACCOUNT) Personal builds, work projects & side projects"
        >
          Personal
          <span class="arrow" aria-hidden="true">↗</span>
          <span class="hint" aria-hidden="true"></span>
        </a>
      </div>
    </section>
  </main>

  <script>
    document.querySelectorAll(".btn").forEach((btn) => {
      const hint = btn.querySelector(".hint");
      const text = btn.getAttribute("data-hint");
      if (hint && text) hint.textContent = text;
    });
  </script>
</body>
</html>
